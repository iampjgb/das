function offProgHTML(){
  if(OFF.ok===false)return `<div class="muted small">Offline storage is not available in this view, so the Bible text loads from the internet as you read.</div>`;
  const pct=Math.floor(OFF.done/OFF.total*100);
  return `<div class="row between small"><span>${OFF.done>=OFF.total?'All Bible text is saved on this device.':OFF.running?(navigator.onLine===false?'Waiting for a connection…':'Saving Bible text to this device…'):'Partly saved.'}</span><b>${pct}%</b></div><div class="progress" style="margin-top:6px"><i style="width:${pct}%"></i></div>
   <div class="muted tiny" style="margin-top:6px">${OFF.done} of ${OFF.total} files · all 8 Bible versions, Hebrew, Greek, cross references and footnotes · about 45 MB${OFF.failed?` · ${OFF.failed} could not be downloaded and will retry`:''}</div>`}
async function preloadAll(force){
  if(OFF.running&&!force)return;const keys=await idbKeys();if(keys===null){OFF.ok=false;updOff();return}OFF.ok=true;
  const have=new Set(keys);const jobs=[];OFF.trs.forEach(t=>BOOKS.forEach((_,i)=>{if(!have.has(t+':'+i))jobs.push([t,i])}));
  OFF.done=OFF.total-jobs.length;OFF.failed=0;updOff();if(!jobs.length){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}return}
  if(navigator.onLine===false)return;OFF.running=true;updOff();
  for(let x=0;x<jobs.length;x+=3){
    if(navigator.onLine===false)break;
    await Promise.allSettled(jobs.slice(x,x+3).map(([t,i])=>{const k=t+':'+i;
      const fromMem=BIB[t]&&BIB[t][i]?Promise.resolve(BIB[t][i]):(CHUNKED.has(t)?fetchChunk(t,Math.floor(i/CHUNK)).then(arr=>arr[i%CHUNK]):fetch('bible/'+t.toLowerCase()+'/'+i+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}));
      return fromMem.then(d=>idbPut(k,d)).then(r=>{if(r===null)throw 0;OFF.done++;updOff()},()=>{OFF.failed++;updOff()})}));
  }
  OFF.running=false;updOff();
  if(OFF.done>=OFF.total){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if(ui.page==='settings')refresh()}
}

    if(S.recent.length)groups.push(['Recent',S.recent.map(r=>({t:r,icon:'clock',q:r})),true]);

  }

  if(pr)pass.push({t:'Open '+fmtRef(pr),s:refText(q).slice(0,90)||'Open in Bible Reader',icon:'book',go:{page:'reader',ref:q}});
  ALLV.filter(v=>v.t.toLowerCase().includes(ql)).slice(0,5).forEach(v=>pass.push({t:v.key,s:v.t,icon:'book',go:{page:'reader',ref:v.key}}));
  if(pass.length)groups.push(['Bible passages',pass]);
  const m=(s)=>String(s).toLowerCase().includes(ql);
  const tp=Object.keys(TOPICS).filter(k=>m(TOPICS[k].name)||m(TOPICS[k].def)).slice(0,5).map(k=>({t:TOPICS[k].name,s:TOPICS[k].def,icon:'tag',go:{page:'topics',topic:k}}));if(tp.length)groups.push(['Topics',tp]);
  const dc=Object.keys(DOCTRINES).filter(k=>m(DOCTRINES[k].name)||m(DOCTRINES[k].def)).slice(0,4).map(k=>({t:DOCTRINES[k].name,s:DOCTRINES[k].def,icon:'landmark',go:{page:'theology',doctrine:k}}));
  Object.keys(COMPARISONS).filter(k=>m(COMPARISONS[k].name)).forEach(k=>dc.push({t:COMPARISONS[k].name,s:'Comparison of views',icon:'landmark',go:{page:'theology',compare:k}}));if(dc.length)groups.push(['Doctrines',dc]);
  const ch=Object.keys(CHARACTERS).filter(k=>m(CHARACTERS[k].name)||m(CHARACTERS[k].bio)).slice(0,4).map(k=>({t:CHARACTERS[k].name,s:CHARACTERS[k].bio,icon:'users',go:{page:'characters',character:k}}));if(ch.length)groups.push(['Characters',ch]);
  const cht=[];for(const bn in EXTRA.titles){EXTRA.titles[bn].forEach((t,ci)=>{if(cht.length<6&&t.toLowerCase().includes(ql))cht.push({t:bn+' '+(ci+1)+' · '+t,icon:'book',go:{page:'reader',ref:bn+' '+(ci+1)}})})}if(cht.length)groups.splice(pass.length?1:0,0,['Chapters',cht]);
  const pl=Object.keys(PLACES).filter(k=>m(PLACES[k].name)||m(PLACES[k].sig)).slice(0,4).map(k=>({t:PLACES[k].name,s:PLACES[k].sig,icon:'mappin',go:{page:'places',place:k}}));if(pl.length)groups.push(['Places',pl]);
  const ns=S.notes.filter(n=>m(n.title)||m(n.ref)||m((n.tags||[]).join(' '))||m(noteSnippet(n))).slice(0,4).map(n=>({t:n.title||'Untitled',s:(n.ref||'')+' · '+noteSnippet(n).slice(0,60),icon:n.type==='journal'?'notebook':'note',go:{page:n.type==='journal'?'journal':'notes',noteId:n.id}}));if(ns.length)groups.push(['Personal notes',ns]);
  const cs=S.collections.filter(c=>m(c.name)||c.items.some(i=>m(i.title))).slice(0,4).map(c=>({t:c.name,s:c.items.length+' items',icon:'folder',go:{page:'collections',colId:c.id}}));if(cs.length)groups.push(['Collections',cs]);

const PEN_W=[2.2,4,7],HL_W=[14,22,32];
/* strokes: {t:'p'|'h', c:color, w:width, p:[x,y,pressure*100,...]} in logical units (page width 1000) */
function drawStroke(ctx,s,k){const p=s.p;if(!p||p.length<3)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.c;ctx.fillStyle=s.c;
  if(s.t==='h'){ctx.globalAlpha=.38;ctx.lineWidth=s.w*k;ctx.beginPath();ctx.moveTo(p[0]*k,p[1]*k);for(let i=3;i<p.length;i+=3)ctx.lineTo(p[i]*k,p[i+1]*k);if(p.length===3)ctx.lineTo(p[0]*k+.1,p[1]*k);ctx.stroke();ctx.restore();return}
  if(p.length===3){ctx.beginPath();ctx.arc(p[0]*k,p[1]*k,s.w*k*.6,0,7);ctx.fill();ctx.restore();return}
  let px=p[0],py=p[1];for(let i=3;i<p.length;i+=3){const x=p[i],y=p[i+1],pr=(p[i+2]||50)/100;const mx=(px+x)/2,my=(py+y)/2;
    ctx.lineWidth=Math.max(.6,s.w*k*(.55+pr*.9));ctx.beginPath();ctx.moveTo(px*k,py*k);ctx.quadraticCurveTo(px*k,py*k,mx*k,my*k);ctx.lineTo(x*k,y*k);ctx.stroke();px=x;py=y}
  ctx.restore()}
function paintCanvas(cv,strokes,H,bg){const W=1000;const cw=cv.clientWidth||cv.parentElement.clientWidth||600;const dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(cw*H/W*dpr);cv.style.height=(cw*H/W)+'px';const ctx=cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  if(bg){ctx.fillStyle=bg;ctx.fillRect(0,0,cv.width,cv.height)}const k=cv.width/W;(strokes||[]).forEach(s=>drawStroke(ctx,s,k));return k}
/* Attach drawing to a canvas. get() returns the strokes array; changed() is called after each change. */
function inkBind(cv,H,get,changed,opts={}){const W=1000;let cur=null,k=1,undo=[];
  const redraw=()=>{k=paintCanvas(cv,get(),H,opts.bg)};redraw();
  const pos=e=>{const r=cv.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*W),Math.round((e.clientY-r.top)/r.height*H),Math.round((e.pressure&&e.pointerType!=='mouse'?e.pressure:.5)*100)]};
  const erase=pt=>{const st=get();const keep=st.filter(s=>{for(let i=0;i<s.p.length;i+=3){if(Math.hypot(s.p[i]-pt[0],s.p[i+1]-pt[1])<14+s.w/2)return false}return true});if(keep.length!==st.length){undo.push(st.slice());st.length=0;keep.forEach(x=>st.push(x));redraw();changed()}};
  const setTA=()=>{cv.style.touchAction=INKTOOL.tool==='hand'||(INKTOOL.pencil&&!opts.finger)?'pan-y':'none'};setTA();cv._setTA=setTA;
  cv.addEventListener('pointerdown',e=>{if(e.pointerType==='pen'&&!INKTOOL.pencil){INKTOOL.pencil=true;$$('canvas.ink').forEach(c=>c._setTA&&c._setTA())}
    if(INKTOOL.tool==='hand'||(INKTOOL.pencil&&e.pointerType==='touch'&&!opts.finger))return;e.preventDefault();cv.setPointerCapture(e.pointerId);opts.onFocus&&opts.onFocus();
    const pt=pos(e);if(INKTOOL.tool==='eraser'){cur={erase:true};erase(pt);return}
    const hl=INKTOOL.tool==='highlighter';cur={t:hl?'h':'p',c:INKTOOL.color,w:(hl?HL_W:PEN_W)[INKTOOL.size],p:[...pt]};
    const ctx=cv.getContext('2d');drawStroke(ctx,cur,k)});
  cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){const pt=pos(ev);if(cur.erase){erase(pt);continue}const n=cur.p.length;if(Math.hypot(pt[0]-cur.p[n-3],pt[1]-cur.p[n-2])<1.5)continue;cur.p.push(...pt)}
    if(!cur.erase){if(cur.t==='h'){redraw();drawStroke(cv.getContext('2d'),cur,k)}else{const ctx=cv.getContext('2d');const n=cur.p.length;if(n>=6)drawStroke(ctx,{...cur,p:cur.p.slice(n-6)},k)}}});
  const end=()=>{if(!cur)return;if(!cur.erase){const st=get();undo.push(st.slice());st.push(cur);redraw();changed()}cur=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',()=>{cur=null;redraw()});
  cv._undo=()=>{const u=undo.pop();if(!u)return false;const st=get();st.length=0;u.forEach(x=>st.push(x));redraw();changed();return true};
  cv._redraw=redraw;return cv}
function inkPaletteHTML(extra){const T=INKTOOL;const tools=[['pen','Pen','edit'],['highlighter','Highlighter','highlighter'],['eraser','Eraser','minus'],['hand','Scroll','up']];
  return `<div class="ipal" data-extra="${encodeURIComponent(extra||'')}">${tools.map(([t,l,ic])=>`<button class="ipal-b${T.tool===t?' on':''}" data-action="inkTool" data-t="${t}" aria-label="${l}" title="${l}">${icon(ic,18)}</button>`).join('')}
   <span class="ipal-sep"></span>${(T.tool==='highlighter'?HL_INK:INK_COLORS).map(c=>`<button class="ipal-c${T.color===c?' on':''}" data-action="inkColor" data-c="${c}" style="--c:${c}" aria-label="Color"></button>`).join('')}
   <span class="ipal-sep"></span>${[0,1,2].map(s=>`<button class="ipal-b${T.size===s?' on':''}" data-action="inkSize" data-s="${s}" aria-label="Size ${s+1}"><i class="ipal-dot" style="width:${4+s*4}px;height:${4+s*4}px"></i></button>`).join('')}
   <span class="ipal-sep"></span><button class="ipal-b" data-action="inkUndo" aria-label="Undo" title="Undo">${icon('undo',19)}</button>${extra||''}</div>`}
function inkToolSet(k,v){if(k==='tool'){const was=INKTOOL.tool;INKTOOL.tool=v;if(v==='highlighter'&&!HL_INK.includes(INKTOOL.color))INKTOOL.color=HL_INK[0];if(v==='pen'&&!INK_COLORS.includes(INKTOOL.color))INKTOOL.color=INK_COLORS[0]}else INKTOOL[k]=v;
  $$('.ipal').forEach(p=>{p.outerHTML=inkPaletteHTML(p.dataset.extra?decodeURIComponent(p.dataset.extra):'')});$$('canvas.ink').forEach(c=>c._setTA&&c._setTA())}

/* ---------- Drawing block editor (full screen) ---------- */
const SK_H=640;
function openSketch(noteId,skId){const ink=inkOf(noteId);const isNew=!skId||!ink.sk[skId];const id=skId||('s'+Date.now().toString(36));
  const work=(isNew?[]:JSON.parse(JSON.stringify(ink.sk[id].strokes||[])));
  const ov=document.createElement('div');ov.className='skov';ov.innerHTML=`<div class="skov-top"><button class="btn ghost sm" data-sk="cancel">Cancel</button><span class="muted small">Drawing</span><button class="btn primary sm" data-sk="done">Done</button></div>
   <div class="skov-body"><div class="skov-paper"><canvas class="ink"></canvas></div><div class="muted tiny" style="text-align:center;margin-top:8px">Draw with your finger or Apple Pencil.</div></div>
   <div class="skov-pal">${inkPaletteHTML(`${isNew?'':`<button class="ipal-b" data-sk="del" aria-label="Delete drawing" title="Delete drawing">${icon('trash',18)}</button>`}`)}</div>`;
  document.body.appendChild(ov);document.body.classList.add('noscroll');if(INKTOOL.tool==='hand')INKTOOL.tool='pen';
  const cv=ov.querySelector('canvas');requestAnimationFrame(()=>inkBind(cv,SK_H,()=>work,()=>{},{finger:true,bg:'#fff'}));
  const close=()=>{ov.remove();document.body.classList.remove('noscroll')};
  ov.addEventListener('click',e=>{const b=e.target.closest('[data-sk]');if(b){const a=b.dataset.sk;
      if(a==='cancel')close();
      if(a==='done'){close();if(!work.length&&isNew)return;ink.sk[id]={strokes:work,t:Date.now()};inkChanged(noteId);wInsertSketch(id,isNew)}
      if(a==='del'){close();delete ink.sk[id];inkChanged(noteId);const f=$(`#wBody figure[data-sk="${id}"]`);f&&f.remove();wQueueSave()}return}
    const u=e.target.closest('[data-action="inkUndo"]');if(u){e.stopPropagation();cv._undo&&cv._undo()}},true)}
function paintSketchFigures(noteId,root){const ink=inkOf(noteId);$$('figure.sk',root||document).forEach(f=>{const s=ink.sk[f.dataset.sk];f.innerHTML='';f.setAttribute('contenteditable','false');
  if(!s){f.innerHTML=`<div class="sk-missing">${icon('edit',16)} Drawing not on this device yet</div>`;return}const cv=document.createElement('canvas');f.appendChild(cv);requestAnimationFrame(()=>paintCanvas(cv,s.strokes,SK_H))})}

   <button class="btn" style="margin:6px auto 0;display:flex" data-action="inkAddPage">${icon('plus',16)}Add page</button></div>`}
function inkPagesMount(n){const ink=inkOf(n.id);$$('canvas.ink[data-pg]').forEach(cv=>{const i=+cv.dataset.pg;inkBind(cv,PG_H,()=>ink.pages[i].strokes,()=>{inkChanged(n.id);n.updated=Date.now()},{onFocus:()=>{INK_PAGE=i}})})}
function inkPageBlob(noteId,i){const s=inkOf(noteId).pages[i];const cv=document.createElement('canvas');cv.width=1000;cv.height=PG_H;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,1000,PG_H);(s.strokes||[]).forEach(x=>drawStroke(ctx,x,1));
  return new Promise(r=>cv.toBlob(r,'image/png'))}
/* ---------- Free-page note editor (notes and my topics) ---------- */

const W={id:null,range:null,saveT:null,open:null,status:''};
const noteById=id=>S.notes.find(n=>n.id===id);
/* rich-text sanitizer used for every note body */
const HL_MAP=[['y','#fff3a3'],['g','#c8f0d4'],['b','#cfe4ff'],['p','#ffd6e7']];
function hlClass(col){const m=String(col).match(/\d+/g);if(!m)return'';const [r,g,b]=m.map(Number);let best='y',bd=1e9;HL_MAP.forEach(([k,h])=>{const R=parseInt(h.slice(1,3),16),G=parseInt(h.slice(3,5),16),B=parseInt(h.slice(5,7),16);const d=(R-r)**2+(G-g)**2+(B-b)**2;if(d<bd){bd=d;best=k}});return (r>245&&g>245&&b>245)?'':'hl-'+best}
function clean(html){
  const d=new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html');const root=d.body.firstChild;
  const ok=new Set(['B','STRONG','I','EM','U','S','UL','OL','LI','P','BR','DIV','BLOCKQUOTE','H2','H3','MARK','A','FIGURE','HR','SECTION']);const kill=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','IMG','SVG','CANVAS','INPUT','BUTTON','TEXTAREA']);
  (function walk(n){[...n.childNodes].forEach(c=>{if(c.nodeType!==1){if(c.nodeType!==3)c.remove();return}
    if(kill.has(c.tagName)||c.classList.contains('ai-ctl')){c.remove();return}
    if(c.tagName==='FIGURE'){const sk=c.getAttribute('data-sk'),a=c.getAttribute('data-a');const f=d.createElement('figure');if(sk&&/^[\w-]+$/.test(sk)){f.className='sk';f.setAttribute('data-sk',sk)}else if(a&&/^[\w-]+$/.test(a)){f.className='att-blk';f.setAttribute('data-a',a)}else{c.remove();return}c.replaceWith(f);return}
    if(c.tagName==='STRIKE'||c.tagName==='DEL'){const s=d.createElement('s');s.append(...c.childNodes);c.replaceWith(s);walk(s);return}
    if(c.tagName==='SPAN'||c.tagName==='FONT'){const st=c.getAttribute('style')||'';const bg=st.match(/background(?:-color)?:\s*([^;]+)/i);const lt=/line-through/.test(st);let el=null;
      if(bg&&hlClass(bg[1])){el=d.createElement('mark');el.className=hlClass(bg[1])}else if(lt){el=d.createElement('s')}
      if(el){el.append(...c.childNodes);c.replaceWith(el);walk(el);return}}
    walk(c);
    if(!ok.has(c.tagName)){c.replaceWith(...c.childNodes);return}
    const keep={};if(c.tagName==='A'&&c.classList.contains('vref')&&parseRef(c.getAttribute('data-ref')))keep['data-ref']=normRef(c.getAttribute('data-ref'));
    if(c.tagName==='UL'&&c.classList.contains('chk'))keep.class='chk';if(c.tagName==='LI'&&c.hasAttribute('data-done'))keep['data-done']='1';
    if(c.tagName==='MARK'&&/^hl-[ygbp]$/.test(c.className))keep.class=c.className;
    const aid=c.getAttribute('data-ai');if((c.tagName==='SECTION'&&c.classList.contains('ai-blk'))||(c.tagName==='MARK'&&c.classList.contains('ai-in'))){if(aid&&/^[\w-]+$/.test(aid))keep['data-ai']=aid;keep.class=c.tagName==='SECTION'?'ai-blk':'ai-in'}
    if(c.tagName==='SECTION'&&!keep.class){c.replaceWith(...c.childNodes);return}
    if(c.tagName==='A'&&!keep['data-ref']){c.replaceWith(...c.childNodes);return}
    [...c.attributes].forEach(a=>c.removeAttribute(a.name));if(c.tagName==='A')keep.class='vref';Object.entries(keep).forEach(([k,v])=>c.setAttribute(k,v))})})(root);
  return root.innerHTML}
/* turn typed references like "Rom 8:28" into tappable links */
const REF_RE=/(?:\b[123]\s?)?\b(?:[A-Z][a-z]{1,15}|[a-z]{3,15})\.?\s?\d{1,3}:\d{1,3}(?:\s?[-–]\s?\d{1,3})?(?:,\s?\d{1,3}(?:[-–]\d{1,3})?)*/g;
function linkifyRefs(root){const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:t=>t.parentElement.closest('a,figure,h2')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
  let changed=false;nodes.forEach(t=>{const s=t.nodeValue;REF_RE.lastIndex=0;if(!REF_RE.test(s))return;REF_RE.lastIndex=0;const frag=document.createDocumentFragment();let last=0,m,any=false;
    while((m=REF_RE.exec(s))){const p=parseRef(m[0]);if(!p)continue;any=true;frag.append(s.slice(last,m.index));const a=document.createElement('a');a.className='vref';a.dataset.ref=normRef(m[0]);a.textContent=m[0];frag.append(a);last=m.index+m[0].length}
    if(any){frag.append(s.slice(last));t.replaceWith(frag);changed=true}});return changed}

/* ---------- open, save, close ---------- */
function newNote(o={}){const now=Date.now();const n={id:uid(),type:'note',title:o.title||'',ref:o.ref||'',tags:o.tags||[],body:o.body||'',files:o.files||[],created:now,updated:now};if(o.topic)n.topic=o.topic;S.notes.unshift(n);return n}
function openWrite(id,o={}){let n=id&&noteById(id);if(!n){n=newNote(o);n._fresh=true}
  if(n.type==='journal'){nav('journal',{jId:n.id});return}
  if(noteEnsureT1(n))save();W.id=n.id;W.editing=!!n._fresh;W.selMode=false;W.open={title:n.title,body:n.body,t:Date.now()};ui.writeId=n.id;ui.writeBack=o.back||(ui.page==='write'?ui.writeBack:ui.page)||'notes';ui.wChat=false;
  nav('write');}
function wNote(){return noteById(ui.writeId)}
function wQueueSave(){clearTimeout(W.saveT);wStatus('Editing');W.saveT=setTimeout(wSaveNow,700)}
function wStatus(s){W.status=s;const e=$('#wStat');if(e)e.innerHTML=wStatHTML()}
function wStatHTML(){return W.editing?`<span class="wdot"></span>Editing${W.status==='Saved'?'<span class="hide-m"> · saved</span>':''}`:'<span class="muted">Reading · tap text to edit</span>'}
function wSaveNow(){clearTimeout(W.saveT);const n=wNote();if(!n)return;const b=$('#wBody'),t=$('#wTitle');
  if(b){n.body=clean(b.innerHTML);wSnap(n.body);n.title=noteFirstLine(n.body)}else if(t)n.title=t.value;
  n.updated=Date.now();delete n._fresh;
  if(n.topic)syncMyTopics();save();wStatus('Saved')}
function wIsEmpty(n){return !String(n.title||'').trim()&&!plain(n.body||'').trim()&&!/<figure/.test(n.body||'')&&!(INK[n.id]&&INK[n.id].pages.some(p=>p.strokes.length))}
function wClose(){const n=wNote();if(n){const b=$('#wBody');if(b)linkifyRefs(b);wSaveNow();wDropOrphans(n);
  if(wIsEmpty(n)){S.notes=S.notes.filter(x=>x!==n);delete INK[n.id];inkStore(n.id);syncMyTopics();save()}
  else if(W.open&&(W.open.body!==n.body||W.open.title!==n.title)&&(W.open.body||W.open.title)){n.history=[{t:W.open.t,title:W.open.title,body:W.open.body},...(n.history||[])].slice(0,10);save()}}
  const back=ui.writeBack||'notes';ui.writeId=null;W.id=null;ui.wChat=false;$('#wSel')&&$('#wSel').remove();
  if(back==='topics'&&n&&n.topic&&!wIsEmpty(n))ui.topic=null;nav(back)}

function wBarHTML(){return wBarInner().replace(/^<div class="(wbar[^"]*)">/,'<div class="$1"><div class="wpill">')+'</div>'}

   ${B('bold','<b>B</b>','Bold')}${B('italic','<i>I</i>','Italic')}${B('underline','<u>U</u>','Underline')}${B('strikeThrough','<s>S</s>','Strikethrough')}<span class="wsep"></span>
   ${HL_MAP.map(([k,c])=>B('hl-'+k,`<i class="wsw" style="background:${c}"></i>`,'Highlight')).join('')}${B('hl-none',`<i class="wsw" style="background:transparent;border:1px dashed var(--border)"></i>`,'No highlight')}<span class="wsep"></span>
   ${B('quote','❝','Quote')}${B('ol','1.','Numbered list')}${B('hr','―','Divider')}<span class="wsep"></span>${B('fmtclose',icon('x',18),'Close formatting')}</div>${wUndoHTML()}</div>`;
  return `<div class="wbar"><div class="wbar-in">
   ${B('fmt','<b style="font-family:var(--serif);font-size:17px">Aa</b>','Text style')}${B('chk',icon('check',19),'Checklist')}${B('ul',icon('list',19),'Bullet list')}${B('verse',icon('book',19),'Insert verse')}
   ${B('attach',icon('paperclip',19),'Photo or file')}${B('pen',icon('edit',19),'Drawing')}${B('scan',icon('scan',19),'Scan handwriting')}${B('ai',icon('sparkles',19),'Ask Claude')}
   </div>${wUndoHTML()}</div>`}
function wUndoHTML(){const u=W.ptr>0,r=W.stack&&W.ptr<W.stack.length-1;return `<div class="wbar-fix"><button class="wb${u?'':' off'}" data-w="undo" aria-label="Undo" title="Undo">${icon('undo',20)}</button><button class="wb${r?'':' off'}" data-w="redo" aria-label="Redo" title="Redo">${icon('redo',20)}</button>${COARSE_KB()?`<button class="wb" data-w="done" aria-label="Hide keyboard" title="Hide keyboard">${icon('down',19)}</button>`:''}</div>`}

function mdHTML(t){const L=String(t||'').replace(/\r/g,'').split('\n');let o='',list=null;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<i>$2</i>');
  const close=()=>{if(list){o+=`</${list}>`;list=null}};
  L.forEach(l=>{const s=l.trim();let m;
    if(!s){close();return}
    if((m=s.match(/^#{1,3}\s+(.*)/))){close();o+=`<h3>${inl(m[1])}</h3>`;return}
    if((m=s.match(/^[-*•]\s+(.*)/))){if(list!=='ul'){close();o+='<ul>';list='ul'}o+=`<li>${inl(m[1])}</li>`;return}
    if((m=s.match(/^\d+[.)]\s+(.*)/))){if(list!=='ol'){close();o+='<ol>';list='ol'}o+=`<li>${inl(m[1])}</li>`;return}
    if((m=s.match(/^>\s?(.*)/))){close();o+=`<blockquote><p>${inl(m[1])}</p></blockquote>`;return}
    close();o+=`<p>${inl(s)}</p>`});close();return o}
